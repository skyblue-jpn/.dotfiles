"$schema" = "https://starship.rs/config-schema.json"

format = """
[](red)\
$os\
$username\
$shell\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_status\
[](fg:yellow bg:green)\
$bun\
$c\
$cpp\
$cmake\
$cobol\
$daml\
$dart\
$deno\
$dotnet\
$elixir\
$elm\
$erlang\
$fennel\
$fortran\
$gleam\
$golang\
$gradle\
$haskell\
$haxe\
$helm\
$java\
$julia\
$kotlin\
$lua\
$maven\
$mojo\
$nim\
$nodejs\
$ocaml\
$odin\
$opa\
$perl\
$php\
$pulumi\
$purescript\
$python\
$quarto\
$raku\
$rlang\
$red\
$ruby\
$rust\
$scala\
$solidity\
$swift\
$terraform\
$typst\
$vlang\
$vagrant\
$xmake\
$zig\
[](fg:green bg:sapphire)\
$docker_context\
$conda\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
$cmd_duration\
$line_break\
$character"""

scan_timeout = 1000

palette = "nord"

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
AIX = " "
AlmaLinux = " "
Alpaquita = " "
Alpine = " "
ALTLinux = "󰻀 "
Amazon = " "
Android = " "
AOSC = " "
Arch = " "
Artix = " "
Bluefin = "󰬜 "
CachyOS = " "
CentOS = " "
Debian = " "
DragonFly = " "
Elementary = " "
Emscripten = " "
EndeavourOS = " "
Fedora = " "
FreeBSD = " "
Garuda = " "
Gentoo = " "
HardenedBSD = "󰞌 "
Illumos = " "
InstantOS = "󰍎 "
Ios = "󰀷 "
Kali = " "
Linux = " "
Mabox = " "
Macos = " "
Manjaro = " "
Mariner = " "
MidnightBSD = " "
Mint = "󰣭 "
NetBSD = " "
NixOS = " "
Nobara = " "
OpenBSD = " "
OpenCloudOS = "☁️ "
openEuler = "󰫈 "
openSUSE = " "
OracleLinux = " "
PikaOS = "󱗆 "
Pop = " "
Raspbian = " "
Redhat = " "
RedHatEnterprise = " "
Redox = "󰀘 "
RockyLinux = " "
Solus = " "
SUSE = " "
Ubuntu = " "
Ultramarine = "󱑼 "
Unknown = " "
Uos = " "
Void = " "
Windows = " "
Zorin = " "

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = "[ $user]($style)"

[shell]
disabled = false
format = "[ $indicator ]($style)"
style = "bg:red fg:crust"
bash_indicator = " "
cmd_indicator = " "
elvish_indicator = "󰘧 "
fish_indicator = "󰈺 "
ion_indicator = " "
nu_indicator = "nu"
powershell_indicator = "󰨊 "
tcsh_indicator = "Tc"
xonsh_indicator = "@ "
zsh_indicator = " "
unknown_indicator = " "

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
format = "[[ $symbol $branch ](fg:crust bg:yellow)]($style)"

[git_status]
style = "bg:yellow"
format = "[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)"

[bun]
symbol = ""
style = "bg:green"
format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"

[c]
symbol = ""
style = "bg:green"
format = "[[ $symbol( $version(-$name)) ](fg:crust bg:green)]($style)"
commands = [["clang", "--version"], ["gcc", "--version"], ["cc", "--version"]]

[cmake]
symbol = ""
style = "bg:green"
format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"

[cobol]
symbol = ""
style = "bg:green"
format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"

[cpp]
disabled = false
symbol = ""
style = "bg:green"
format = "[[ $symbol( $version(-$name)) ](fg:crust bg:green)]($style)"
commands = [["clang++", "--version"], ["g++", "--version"], ["c++", "--version"]]

[daml]
symbol = ""
style = "bg:green"
format = "[[ $symbol( $version) ](fg:crust bg:green)]($style)"

