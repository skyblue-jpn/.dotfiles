[dotfiles]
"~/.Rprofile" = { source = "../home/.Rprofile" }
"~/.bashrc/fzf" = { block = '''
  export FZF_DEFAULT_OPTS=" \
  --color=bg+:#363A4F,bg:#24273A,spinner:#F4DBD6,hl:#ED8796 \
  --color=fg:#CAD3F5,header:#ED8796,info:#C6A0F6,pointer:#F4DBD6 \
  --color=marker:#B7BDF8,fg+:#CAD3F5,prompt:#C6A0F6,hl+:#ED8796 \
  --color=selected-bg:#494D64 \
  --color=border:#6E738D,label:#CAD3F5"
  ''' }
"~/.config/bat" = { source = "../home/.config/bat" }
"~/.config/bottom" = { source = "../home/.config/bottom" }
"~/.config/eza" = { source = "../home/.config/eza" }
"~/.config/DankMaterialShell/plugins.lock.json" = { source = "../home/.config/DankMaterialShell/plugins.lock.json" }
"~/.config/DankMaterialShell/settings.json" = { source = "../home/.config/DankMaterialShell/settings.json" }
"~/.config/DankMaterialShell/themes" = { source = "../home/.config/DankMaterialShell/themes" }
"~/.config/dankcal" = { source = "../home/.config/dankcal" }
"~/.config/danksearch" = { source = "../home/.config/danksearch" }
"~/.config/dgop" = { source = "../home/.config/dgop" }
"~/.config/cava" = { source = "../home/.config/cava" }
"~/.config/environment.d" = { source = "../home/.config/environment.d" }
"~/.config/fcitx5/conf/classicui.conf" = { source = "../home/.config/fcitx5/conf/classicui.conf" }
"~/.config/fish/config.fish/catppuccin" = { block = "fish_config theme choose catppuccin-macchiato --color-theme=dark" }
"~/.config/fish/config.fish/fzf" = { block = '''
  set -Ux FZF_DEFAULT_OPTS "\
  --color=bg+:#363A4F,bg:#24273A,spinner:#F4DBD6,hl:#ED8796 \
  --color=fg:#CAD3F5,header:#ED8796,info:#C6A0F6,pointer:#F4DBD6 \
  --color=marker:#B7BDF8,fg+:#CAD3F5,prompt:#C6A0F6,hl+:#ED8796 \
  --color=selected-bg:#494D64 \
  --color=border:#6E738D,label:#CAD3F5"
  ''' }
"~/.config/fontconfig/fonts.conf" = { source = "../home/.config/fontconfig/fonts.conf" }
"~/.config/ghostty" = { source = "../home/.config/ghostty" }
"~/.config/gtk-3.0" = { source = "../home/.config/gtk-3.0" }
"~/.config/gtk-4.0" = { source = "../home/.config/gtk-4.0" }
"~/.config/heroic/config.json" = { source = "../home/.config/heroic/config.json" }
"~/.config/heroic/themes" = { source = "../home/.config/heroic/themes" }
"~/.config/kdeglobals" = { source = "../home/.config/kdeglobals" }
"~/.config/niri" = { source = "../home/.config/niri" }
"~/.config/nvim" = { source = "../home/.config/nvim" }
"~/.config/nwg-look" = { source = "../home/.config/nwg-look" }
"~/.config/qtengine" = { source = "../home/.config/qtengine" }
"~/.config/radian" = { source = "../home/.config/radian" }
"~/.config/starship.toml" = { source = "../home/.config/starship.toml" }
"~/.config/tabby/config.yaml" = { source = "../home/.config/tabby/config.yaml" }
"~/.config/xsettingsd" = { source = "../home/.config/xsettingsd" }
"~/.config/yazi" = { source = "../home/.config/yazi" }
"~/.config/zed" = { source = "../home/.config/zed" }
"~/.gtkrc-2.0" = { source = "../home/.gtkrc-2.0" }
"~/.icons" = { source = "../home/.icons" }
