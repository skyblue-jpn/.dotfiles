[bootstrap.hooks.post-tools]
run = [
  "mise exec cargo:pez -- pez install --force",
  'if command -v nvim >/dev/null 2>&1; then nvim --headless "+Lazy! sync" +qa; fi',
]

[bootstrap.hooks.post-packages]
run = [
  "miktexsetup finish",
  '"$(command -v initexmf || echo /opt/miktex/bin/initexmf)" --set-config-value "[MPM]AutoInstall=1"',
  "miktex packages update",
]
