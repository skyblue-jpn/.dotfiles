Void = " "
Windows = " "
Zorin = " "

[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:#394260"
format = "[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)"

[git_status]
style = "bg:#394260"
format = "[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)"

[bun]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol( $version) ](fg:#769ff0 bg:#212736)]($style)"

[c]
symbol = ""
style = "bg:#212736"
format = "[[ $symbol( $version(-$name)) ](fg:#769ff0 bg:#212736)]($style)"
commands = [["clang", "--version"], ["gcc", "--version"], ["cc", "--version"]]

[cmake]
symbol = ""
style = "bg:#212736"
