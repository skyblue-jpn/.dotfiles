[shell_alias]
cd = "z"
ci = "zi"
vi = "nvim"
vim = "nvim"
ls = "eza --icons=auto"
la = "eza --icons=auto -lbhHigUmuSa"
lx = "eza --icons=auto -lbhHigUmuSa@"
l = "eza --icons=auto --git-ignore"
ll = "eza --icons=auto --all --header --long"
llm = "eza --icons=auto --all --header --long --sort=modified"
lt = "eza --icons=auto --all --tree --level=2"
tree = "eza --icons=auto --all --tree"
cat = "bat"
fzf = "fzf --preview 'bat --color=always {}' --preview-window '~3'"
r = "radian"
mirror-update = "sudo cachyos-rate-mirrors && rate-mirrors chaotic-aur | sudo tee /etc/pacman.d/chaotic-mirrorlist"

[env]
EDITOR = "nvim"
FZF_ALT_C_COMMAND = "fd --type d"
FZF_CTRL_T_COMMAND = "fd --type f"
FZF_DEFAULT_COMMAND = "fd --type f"
GTK_THEME = "adw-gtk3"
MANPAGER = "bat -plman"
PROTON_ENABLE_HDR = 1
PROTON_ENABLE_WAYLAND = 1
PROTON_NO_WM_DECORATION = 1
PROTON_USE_NTSYNC = 1
QT_IM_MODULE = "fcitx"
QT_QPA_PLATFORM = "wayland"
QT_QPA_PLATFORMTHEME = "qtengine"
QT_QPA_PLATFORMTHEME_QT6 = "qtengine"
QT_PLUGIN_PATH = "/usr/lib/qt5/plugins/"
TERMINAL = "ghostty"
VISUAL = "nvim"
XCURSOR_SIZE = "24"
XCURSOR_THEME = "Colloid-dark Cursors"
XDG_SESSION_TYPE = "wayland"
XMODIFIERS = "@im=fcitx"
