[bootstrap.repos]
"~/src/Colloid-icon-theme" = { url = "https://github.com/vinceliuice/Colloid-icon-theme.git" }

[bootstrap.linux.firewall]
backend = "auto"
state = "enabled"

[[bootstrap.linux.firewall.rules]]
name = "kde-connect-tcp"
port = "1714-1764"
protocol = "tcp"
action = "allow"

[[bootstrap.linux.firewall.rules]]
name = "kde-connect-udp"
port = "1714-1764"
protocol = "udp"
action = "allow"

[bootstrap.hooks.pre-packages]
run = [
  "sudo pacman -S --noconfirm --needed rate-mirrors paru",
  "chmod +x ~/.dotfiles/scripts/add-chaotic-aur.sh && ~/.dotfiles/scripts/add-chaotic-aur.sh",
  # "rate-mirrors arch | sudo tee /etc/pacman.d/mirrorlist",
  # "rate-mirrors cachyos | sudo tee /etc/pacman.d/cachyos-mirrorlist",
  "sudo cachyos-rate-mirrors && rate-mirrors chaotic-aur | sudo tee /etc/pacman.d/chaotic-mirrorlist && paru -Syyu --noconfirm",
  "yes | paru -S --needed sudo-rs coreutils-uutils",
  "sudo -v && curl -fsSL https://install.danklinux.com | sh -s -- -c niri -t ghostty --include-deps dms-greeter,danksearch,dankcalendar -y",
  "yes | paru -S --needed extra/dms-shell",
  "sudo timedatectl set-local-rtc 1",
]

[bootstrap.hooks.post-packages]
run = [
  "paru -S --noconfirm --needed - < ~/.dotfiles/aur_pkglist.txt",
  "sudo waydroid init",
]

[bootstrap.hooks.post-tools]
run = [
  "~/src/Colloid-icon-theme/install.sh -s catppuccin -t purple",
  "cd ~/src/Colloid-icon-theme/cursors && ./install.sh",
  "paru -S --noconfirm --needed plymouth-theme-catppuccin-macchiato-git && sudo plymouth-set-default-theme -R catppuccin-macchiato",
  "mise exec cargo:pez -- pez install",
  "mise exec bat -- bat cache --build",
  "chmod +x ~/.dotfiles/scripts/mount-filesystem.sh && ~/.dotfiles/scripts/mount-filesystem.sh",
  "sudo systemctl start bpftune && sudo systemctl enable bpftune",
]

[bootstrap.hooks.final]
run = [
  "mise bootstrap: Completed!",
]

[bootstrap.mise_shell_activate]
bash_profile = "shims"
bashrc = "activate"

[bootstrap.user]
login_shell = "/usr/bin/fish"

[dotfiles]
"~/.Rprofile" = {}
"~/.bashrc/batman" = { block = 'eval "$(batman --export-env)"' }
"~/.bashrc/fzf" = { block = '''
  eval "$(fzf --bash)"
  export FZF_DEFAULT_OPTS=" \
  --color=bg+:#363A4F,bg:#24273A,spinner:#F4DBD6,hl:#ED8796 \
  --color=fg:#CAD3F5,header:#ED8796,info:#C6A0F6,pointer:#F4DBD6 \
  --color=marker:#B7BDF8,fg+:#CAD3F5,prompt:#C6A0F6,hl+:#ED8796 \
  --color=selected-bg:#494D64 \
  --color=border:#6E738D,label:#CAD3F5"
  ''' }
"~/.bashrc/pay-respects" = { block = 'eval "$(pay-respects bash)"' }
"~/.bashrc/starship" = { block = 'eval "$(starship init bash)"' }
"~/.bashrc/zoxide" = { block = 'eval "$(zoxide init bash)"' }
"~/.config/DankMaterialShell" = {}
"~/.config/bat" = {}
"~/.config/bottom" = {}
"~/.config/cava" = {}
"~/.config/dankcal" = {}
"~/.config/danksearch" = {}
"~/.config/dgop" = {}
"~/.config/environment.d" = {}
"~/.config/eza" = {}
"~/.config/fcitx5/conf/classicui.conf" = {}
"~/.config/fish/completions" = {}
"~/.config/fish/config.fish/batman" = { block = "batman --export-env | source" }
"~/.config/fish/config.fish/catppuccin" = { block = "fish_config theme choose catppuccin-macchiato --color-theme=dark" }
"~/.config/fish/config.fish/fzf" = { block = '''
  fzf --fish | source
  set -Ux FZF_DEFAULT_OPTS "\
  --color=bg+:#363A4F,bg:#24273A,spinner:#F4DBD6,hl:#ED8796 \
  --color=fg:#CAD3F5,header:#ED8796,info:#C6A0F6,pointer:#F4DBD6 \
  --color=marker:#B7BDF8,fg+:#CAD3F5,prompt:#C6A0F6,hl+:#ED8796 \
  --color=selected-bg:#494D64 \
  --color=border:#6E738D,label:#CAD3F5"
  ''' }
"~/.config/fish/config.fish/mise" = { block = '''
  if status is-interactive
    mise activate fish | source
  else
    mise activate fish --shims | source
  end
  ''' }
"~/.config/fish/config.fish/pay-respects" = { block = "pay-respects fish | source" }
"~/.config/fish/config.fish/pez" = { block = "pez activate fish | source" }
"~/.config/fish/config.fish/starship" = { block = "starship init fish | source" }
"~/.config/fish/config.fish/zoxide" = { block = "zoxide init fish | source" }
"~/.config/fish/functions/repo.fish" = {}
"~/.config/fish/functions/y.fish" = {}
"~/.config/fish/pez.toml" = {}
"~/.config/fontconfig/fonts.conf" = {}
"~/.config/ghostty" = {}
"~/.config/gtk-3.0" = {}
"~/.config/gtk-4.0" = {}
"~/.config/heroic/config.json" = {}
"~/.config/heroic/themes" = {}
